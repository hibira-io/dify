name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Check the tag matches manifest.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(sed -n 's/^version: *//p' manifest.yaml | head -1)" = "${GITHUB_REF_NAME}"
      - id: pkg
        run: echo "path=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: difypkg
          path: ${{ steps.pkg.outputs.path }}
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.path }}" --clobber
