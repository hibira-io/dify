identity:
  name: publish_event
  author: hibira
  label:
    en_US: Publish Event
    zh_Hans: 发布事件
    ja_JP: イベントを配信
description:
  human:
    en_US: Send a realtime event to every client subscribed to one or more channels.
    zh_Hans: 向订阅了一个或多个频道的所有客户端发送实时事件。
    ja_JP: 1 つ以上のチャンネルを購読しているすべてのクライアントにリアルタイムイベントを送ります。
  llm: Publish a realtime event to Hibira channels so that connected browsers and apps receive it instantly. Use it to update a live dashboard, notify users in an open page, or stream progress.
parameters:
  - name: channels
    type: string
    required: true
    form: llm
    label:
      en_US: Channels
      zh_Hans: 频道
    human_description:
      en_US: Channel names, separated by commas (at most 100)
      zh_Hans: 频道名称，以逗号分隔（最多 100 个）
    llm_description: Comma-separated channel names, for example "orders" or "private-user-42". At most 100.
  - name: event
    type: string
    required: true
    form: llm
    label:
      en_US: Event Name
      zh_Hans: 事件名称
    human_description:
      en_US: The event name clients listen for, such as order-updated
      zh_Hans: 客户端监听的事件名称，例如 order-updated
    llm_description: Event name the clients listen for, for example "order-updated". Must not start with "pusher:".
  - name: data
    type: string
    required: true
    form: llm
    label:
      en_US: Data
      zh_Hans: 数据
    human_description:
      en_US: The event payload, usually JSON text (at most 10 KB)
      zh_Hans: 事件内容，通常是 JSON 文本（最多 10 KB）
    llm_description: Event payload as a string, usually JSON such as {"status":"shipped"}. At most 10 KB.
  - name: socket_id
    type: string
    required: false
    form: form
    label:
      en_US: Exclude Socket ID
      zh_Hans: 排除的 Socket ID
    human_description:
      en_US: Do not send the event to this connection (the sender's own socket)
      zh_Hans: 不把事件发给这个连接（通常是发送者自己的 socket）
extra:
  python:
    source: tools/publish_event.py
